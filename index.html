<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypackel Remodified</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#111] to-[#222] text-white min-h-screen flex flex-col items-center justify-center relative">

  <!-- Alert Header with Link -->
  <div class="fixed top-0 w-full bg-orange-600 text-white text-center py-3 text-lg font-semibold shadow-lg z-50">
    🚀 We have moved over to 
    <a href="https://vk-sites.roswagger.com/servers" class="underline hover:text-gray-200 transition">
      VkGames
    </a> — check us out!. This site has 100% working games (VkGames) and this site will be deprecated soon.
  </div>

  <div class="flex flex-col md:flex-row gap-12 w-11/12 max-w-6xl mt-24">
    <div class="flex-1 text-center md:text-left space-y-4">
      <h1 class="text-5xl md:text-7xl font-bold text-orange-500 drop-shadow-[0_0_15px_#ff6600]">
        Welcome to Hypackel
      </h1>
      <p id="daily-quote" class="text-gray-300 italic"></p>
      <div class="flex flex-col md:flex-row gap-4 md:gap-6 justify-center md:justify-start">
        <a href="fork/0/g/" class="bg-orange-600 hover:bg-orange-700 transition-transform transform hover:-translate-y-1 px-6 py-3 rounded-lg font-semibold shadow-md text-white text-lg">
          Games
        </a>
        <a href="fork/0/a/" class="bg-indigo-600 hover:bg-indigo-700 transition-transform transform hover:-translate-y-1 px-6 py-3 rounded-lg font-semibold shadow-md text-white text-lg">
          External Apps
        </a>
      </div>
    </div>

    <!-- Browser Container -->
    <div class="flex-1 bg-[#222] rounded-xl shadow-lg overflow-hidden">
      <div class="flex items-center space-x-2 bg-[#333] px-4 py-2 text-sm text-gray-300">
        <span class="w-3 h-3 bg-red-500 rounded-full"></span>
        <span class="w-3 h-3 bg-yellow-400 rounded-full"></span>
        <span class="w-3 h-3 bg-green-500 rounded-full"></span>
        <span class="ml-3">Introduction to Hypackel</span>
      </div>
      <iframe class="w-full h-[400px]" src="https://www.youtube.com/embed/MoCun0uniCQ?si=2dzaraUMluvrfYXe" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function getParameterByName(name) {
      let urlParams = new URLSearchParams(window.location.search);
      return urlParams.has(name);
    }

    function redirectIfCloaked() {
      if (getParameterByName("iscloaked")) {
        let newTab = window.open("about:blank", "_blank");
        if (newTab) {
          newTab.document.write(`
            <html>
              <head><title>Loading...</title></head>
              <body style="margin:0;">
                <iframe src="https://example.com" style="width:100vw;height:100vh;border:none;"></iframe>
              </body>
            </html>
          `);
          newTab.document.close();
          window.location.href = "https://www.google.com";
        } else {
          alert("Popup blocked! Please allow pop-ups for this site.");
        }
      }
    }

    document.addEventListener("DOMContentLoaded", redirectIfCloaked);
  </script>

</body>
</html>
