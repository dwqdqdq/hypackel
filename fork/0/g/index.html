<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games | Hypackel</title>
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="stylesheet" href="../assets/css/games.css" />
  <link rel="stylesheet" href="search.css">
  <script src="search.js"></script>
  <script src="/fork/0/assets/js/nodrag.js"></script>
  <link rel="stylesheet" href="/fork/0/assets/css/tos.css">
  <link rel="stylesheet" href="/fork/0/assets/css/rainbow.css">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #111;
      color: #fff;
    }

    /* Subtitle Styles */
    .subtitle {
      text-align: center;
      font-size: 3rem;
      font-weight: 600;
      color: #FF0000;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin-top: 20px;
    }

    /* Search bar styles */
    .search-container {
      text-align: center;
      padding-top: 20px;
    }

    #search-bar {
      width: 80%;
      padding: 12px;
      font-size: 1.2rem;
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #333;
      border-radius: 12px;
      color: #fff;
      transition: all 0.3s ease;
    }

    #search-bar:focus {
      outline: none;
      border-color: #00ff00;
    }

    /* Tab cloak dropdown styles */
    #tabCloak {
      width: 80%;
      padding: 12px;
      font-size: 1.1rem;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 2px solid #333;
      border-radius: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    #tabCloak:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* Game container and card styles */
    .game-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
    }

    .game-card {
      width: 250px;
      margin: 10px;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
      background-color: #222;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .image-container {
      width: 100%;
      height: 180px;
      overflow: hidden;
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-card h3 {
      text-align: center;
      font-size: 1.2rem;
      padding: 10px;
      margin: 0;
      background-color: #333;
    }

    /* Footer styles */
    footer {
      margin-bottom: 4em;
      margin-top: 9em;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="subtitle">
    Hypackel Remodified
  </div>

  <div class="search-container">
    <input type="text" id="search-bar" placeholder="Search..." oninput="search()" class="search-input" />
  </div>


  <div class="game-container" id="game-container">
    <!-- Game Cards will be populated here via the script -->
  </div>

  <footer>
    <center>&copy; 2023 Hypackel</center>
  </footer>

  <script>
    fetch('games.json')
      .then(response => response.json())
      .then(data => {
        const gameContainer = document.getElementById('game-container');

        data.forEach(game => {
          const gameCard = document.createElement('div');
          gameCard.classList.add('game-card');

          gameCard.addEventListener('click', function () {
            if (game.requiresProxy) {
              const userResponse = prompt('A Proxy or VPN is required to play this game. Do you have a proxy or VPN enabled? (yes/no)');

              if (userResponse && userResponse.toLowerCase() === 'yes') {
                window.location.href = game.url;
              } else {
                alert('You need a proxy or VPN to play this game. Please enable one and come back.');
              }
            } else {
              window.location.href = game.url;
            }
          });

          const imageContainer = document.createElement('div');
          imageContainer.classList.add('image-container');

          const img = document.createElement('img');
          img.src = game.imageSrc;
          img.onerror = function () {
            this.src = '/fork/image-placeholder.png';
          };

          const h3 = document.createElement('h3');
          h3.textContent = game.name;

          imageContainer.appendChild(img);
          gameCard.appendChild(imageContainer);
          gameCard.appendChild(h3);
          gameContainer.appendChild(gameCard);
        });
      })
      .catch(error => {
        console.error('Error loading JSON data:', error);
      });
  </script>
</body>

</html>
