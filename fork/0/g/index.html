<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <!-- Google Font Link for Poppins (Thin font) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111, #222);
            color: white;
            overflow-y: auto;
            position: relative;
        }

        /* Transparent Header with neon text effect */
        .header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            background: rgba(0, 0, 0, 0.3); /* Transparent background */
            color: white;
            font-size: 50px; /* Increased font size for better visibility */
            font-weight: 100; /* Thin weight for the Poppins font */
            text-transform: uppercase;
            font-family: 'Poppins', sans-serif;
            text-shadow: 
                0 0 5px #ffffff, 
                0 0 10px #ffffff, 
                0 0 20px #FF0000, 
                0 0 30px #FF0000, 
                0 0 40px #FF0000, 
                0 0 50px #FF0000, 
                0 0 75px #FF0000; /* Neon Effect */
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 150px;
        }

        .game-card {
            background: #333;
            color: white;
            border-radius: 10px;
            margin: 20px;
            width: 300px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease, background-color 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: scale(1.05);
            background-color: #444;
        }

        .image-container {
            height: 150px;
            margin-bottom: 15px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #bbb;
        }

        @media (max-width: 768px) {
            .game-card {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Transparent header with neon effect -->
    <div class="header">
        Hypackel Remodified
    </div>

    <div class="game-container" id="game-container"></div>

    <footer class="footer">
        <center>&copy; 2023 Hypackel<br><br>
            <div align='center'>
            </div>
        </center>
    </footer>

    <script>
        fetch('games.json')
            .then(response => response.json())
            .then(data => {
                const gameContainer = document.getElementById('game-container');

                data.forEach(game => {
                    const gameCard = document.createElement('div');
                    gameCard.classList.add('game-card');

                    gameCard.addEventListener('click', function () {
                        if (game.requiresProxy) {
                            const userResponse = prompt('A Proxy or VPN is required to play this game. Do you have a proxy or VPN enabled? (yes/no)');

                            if (userResponse && userResponse.toLowerCase() === 'yes') {
                                window.location.href = game.url;
                            } else {
                                alert('You need a proxy or VPN to play this game. Please enable one and come back.');
                            }
                        } else {
                            window.location.href = game.url;
                        }
                    });

                    const imageContainer = document.createElement('div');
                    imageContainer.classList.add('image-container');

                    const img = document.createElement('img');
                    img.src = game.imageSrc;
                    img.onerror = function () {
                        this.src = '/fork/image-placeholder.png';
                    };

                    const h3 = document.createElement('h3');
                    h3.textContent = game.name;

                    imageContainer.appendChild(img);
                    gameCard.appendChild(imageContainer);
                    gameCard.appendChild(h3);
                    gameContainer.appendChild(gameCard);
                });
            })
            .catch(error => {
                console.error('Error loading JSON data:', error);
            });
    </script>

    <script src="/vobs.js"></script>
</body>
</html>
